name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly run of the @network e2e tests against real youtube.com.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: phasa-chrome-zip
          path: .output/*.zip
          if-no-files-found: error
          # .output starts with a dot; upload-artifact skips hidden paths by default.
          include-hidden-files: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Offline e2e (stubbed YouTube)
        if: github.event_name != 'schedule'
        run: npm run test:e2e
      - name: Network e2e (real YouTube)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:e2e:network
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
